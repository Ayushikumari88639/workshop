<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>LIFEBRIDGE - Immersive 3D Experience</title>
    
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    
    <!-- A-Frame Extras for movement controls -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
    
    <!-- A-Frame Environment Component for stunning backgrounds instantly -->
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <!-- Custom Component for Hover/Click Interactions -->
    <script>
        AFRAME.registerComponent('interactive-node', {
            schema: {
                color: {default: '#e63946'},
                hoverColor: {default: '#00ffcc'}
            },
            init: function () {
                var el = this.el;
                var data = this.data;
                var originalColor = data.color;

                el.addEventListener('mouseenter', function () {
                    // Make it glow and change color on hover
                    el.setAttribute('material', 'color', data.hoverColor);
                    el.setAttribute('material', 'emissive', data.hoverColor);
                    el.setAttribute('material', 'emissiveIntensity', 0.8);
                    el.setAttribute('scale', '1.15 1.15 1.15');
                    
                    // Show details panel
                    var details = el.querySelector('.details');
                    if(details) details.setAttribute('visible', 'true');
                });

                el.addEventListener('mouseleave', function () {
                    // Revert to original state
                    el.setAttribute('material', 'color', originalColor);
                    el.setAttribute('material', 'emissive', originalColor);
                    el.setAttribute('material', 'emissiveIntensity', 0.5);
                    el.setAttribute('scale', '1 1 1');
                    
                    // Hide details panel
                    var details = el.querySelector('.details');
                    if(details) details.setAttribute('visible', 'false');
                });
            }
        });
    </script>
</head>
<body>
    <!-- Added anti-aliasing and color management for better visuals -->
    <a-scene renderer="colorManagement: true; antialias: true;" fog="type: exponential; color: #1d3557; density: 0.02">
        
        <!-- Player Rig -->
        <a-entity id="rig" movement-controls="speed: 0.15">
            <a-entity camera position="0 1.6 0" look-controls>
                <a-cursor raycaster="objects: .clickable" color="#00ffcc" animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"></a-cursor>
            </a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 20"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 20"></a-entity>
        </a-entity>

        <!-- Breathtaking Environment (Preset: contact) -->
        <!-- This adds an immediate premium feel with grid lights and a futuristic sky -->
        <a-entity environment="preset: contact; skyType: atmosphere; lighting: point; groundColor: #1d3557; grid: 1x1; gridColor: #e63946"></a-entity>

        <!-- Central Hologram Platform -->
        <a-cylinder position="0 0.1 -5" radius="3.5" height="0.1" color="#112233" material="metalness: 0.8; roughness: 0.2" shadow="receive: true"></a-cylinder>
        <a-ring position="0 0.16 -5" rotation="-90 0 0" radius-inner="3.3" radius-outer="3.5" color="#00ffcc" material="emissive: #00ffcc; emissiveIntensity: 1"></a-ring>
        
        <!-- Main Title with floating animation -->
        <a-entity position="0 4 -5" animation="property: object3D.position.y; to: 4.2; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine">
            <a-text value="LIFEBRIDGE" align="center" color="#ffffff" scale="4 4 4" font="mozillavr"></a-text>
            <a-text value="Connecting Hope, Saving Lives" position="0 -0.8 0" align="center" color="#00ffcc" scale="1.2 1.2 1.2"></a-text>
        </a-entity>

        <!-- Interactive Hubs -->
        
        <!-- 1. Organ Donation -->
        <a-entity position="-2.5 1.5 -4" class="clickable" interactive-node="color: #e63946; hoverColor: #00ffcc" 
                  geometry="primitive: octahedron; radius: 0.5" material="color: #e63946; emissive: #e63946; emissiveIntensity: 0.5; wireframe: false" 
                  animation="property: rotation; to: 0 360 0; dur: 5000; loop: true; easing: linear">
            
            <!-- We counter-rotate the text so it stays readable while the shape spins -->
            <a-entity animation="property: rotation; to: 0 -360 0; dur: 5000; loop: true; easing: linear">
                <a-text value="ORGAN DONATION" position="0 1 0" align="center" color="#ffffff" scale="1.2 1.2 1.2" side="double"></a-text>
                <!-- Hidden Details Panel -->
                <a-plane class="details" visible="false" position="0 -1.2 0" width="2" height="0.8" color="#1d3557" material="opacity: 0.9">
                    <a-text value="Pledge to donate organs.\n1 donor can save 8 lives." align="center" scale="0.7 0.7 0.7" color="#ffffff"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

        <!-- 2. Blood Network -->
        <!-- Pulsing animation to represent a heartbeat -->
        <a-entity position="0 1.5 -5" class="clickable" interactive-node="color: #e63946; hoverColor: #00ffcc" 
                  geometry="primitive: sphere; radius: 0.4" material="color: #e63946; emissive: #e63946; emissiveIntensity: 0.5" 
                  animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 800; loop: true; easing: easeInOutSine">
            
            <a-text value="BLOOD NETWORK" position="0 1 0" align="center" color="#ffffff" scale="1.2 1.2 1.2" side="double"></a-text>
            <a-plane class="details" visible="false" position="0 -1.2 0" width="2" height="0.8" color="#1d3557" material="opacity: 0.9">
                <a-text value="Emergency blood matching.\nReal-time alert network." align="center" scale="0.7 0.7 0.7" color="#ffffff"></a-text>
            </a-plane>
            
            <!-- Orbiting element around the blood sphere -->
            <a-entity animation="property: rotation; to: 0 360 0; dur: 2000; loop: true; easing: linear">
                <a-sphere position="0.8 0 0" radius="0.08" color="#00ffcc" material="emissive: #00ffcc; emissiveIntensity: 2"></a-sphere>
            </a-entity>
        </a-entity>

        <!-- 3. Emergency Response -->
        <a-entity position="2.5 1.5 -4" class="clickable" interactive-node="color: #e63946; hoverColor: #00ffcc" 
                  geometry="primitive: dodecahedron; radius: 0.5" material="color: #e63946; emissive: #e63946; emissiveIntensity: 0.5" 
                  animation="property: rotation; to: 360 360 0; dur: 8000; loop: true; easing: linear">
            
            <a-entity animation="property: rotation; to: -360 -360 0; dur: 8000; loop: true; easing: linear">
                <a-text value="EMERGENCY" position="0 1 0" align="center" color="#ffffff" scale="1.2 1.2 1.2" side="double"></a-text>
                <a-plane class="details" visible="false" position="0 -1.2 0" width="2" height="0.8" color="#1d3557" material="opacity: 0.9">
                    <a-text value="24/7 Crisis Response.\nFind immediate matches." align="center" scale="0.7 0.7 0.7" color="#ffffff"></a-text>
                </a-plane>
            </a-entity>
        </a-entity>

    </a-scene>
</body>
</html>
